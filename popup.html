<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 250px;
            font-family: Arial, sans-serif;
            padding: 15px;
            text-align: center;
        }

        button {
            padding: 10px;
            width: 100%;
            background: #d9534f;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 5px;
            margin-top: 10px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }

        .footer a {
            color: #0275d8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h3 id="title">Boring Social Media</h3>
    <select id="langSelect">
        <option value="en">English</option>
        <option value="fa">فارسی</option>
    </select>
    <button id="pauseBtn">5-Min Pause (Emergency)</button>

    <div class="footer">
        <span id="credit">Developed by </span><br>
        <a href="https://github.com/Alisina7" target="_blank">Sina Kazemi</a>
    </div>
    <script src="popup.js"></script>
</body>

</html>
